## What runs, and why each part is here
##
## `verify` is the gate that had no runner: the mapper-exhaustiveness check and the
## "every declared property survives into the spec" check both live in the test suite,
## and typechecking is a separate command, so neither bites unless something runs both.
## See docs/spec-extension-plan.md §5.1.
##
## `render` is the half the data-level tests cannot reach: it draws every corpus case in
## a real browser and asserts Highcharts did not throw and that the rendered chart holds
## the series and point counts the corpus expects. The screenshots are uploaded for a
## human, deliberately not compared pixel by pixel (§5.4).
##
## The action majors are the ones whose runtime is `node24`, because the runner now forces
## them there and warns on every run otherwise. Read from each action's own `action.yml`
## rather than from habit: `checkout@v5` and `setup-node@v6` both say `using: node24`, and
## `upload-artifact` needs **v6** — its v5 still declares `node20`, so bumping it by one
## major looks like the fix and is not.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16'
          cache: npm
      - run: npm ci
      - run: npm run verify
      # The example page is a consumer of the library, and it rots the same way anything else
      # does: a renamed export, a changed prop. `verify` typechecks it; this also bundles it,
      # which is the only check that catches a broken import React's types are happy with.
      - run: npm run build --workspace examples/react-highcharts

  render:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16'
          cache: npm
      - run: npm ci
      # The library has no runtime dependencies; this is the repository's first dev one,
      # and it is here for one reason: a rendering assertion cannot be written without a
      # renderer (roadmap item 17 asks for exactly that kind of reason).
      - run: npx playwright install --with-deps chromium
      - run: npm run render
      - name: Keep the screenshots for review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: render-matrix
          path: render-out/
          if-no-files-found: warn
          retention-days: 14
